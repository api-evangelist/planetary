name: Planetary
description: Planetary is a decentralized, peer-to-peer social networking company built on the Secure
  Scuttlebutt (SSB) protocol, offering an iOS app for algorithm-free social media where users own and
  store their data locally with no advertising and no data selling. The team has since migrated its
  design, app, and philosophy to the Nostr protocol under a new app, nos.social. The project is fully
  open source, developed in the open on GitHub, and is a portfolio company of Bloomberg Beta. Planetary
  exposes no commercial REST/HTTP API; its developer surface is the underlying SSB/Nostr protocol
  documentation (RPC methods, replication, blobs) rather than a hosted web API.
